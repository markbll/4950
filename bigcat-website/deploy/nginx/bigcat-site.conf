# Shared site rules — included by the staging and production server blocks.
# Expects $bigcat_root, $bigcat_private and $bigcat_robots to be set.
# Adjust fastcgi_pass to your PHP-FPM socket (PHP 8.2+ required).

root $bigcat_root/dist;
index index.html;
charset utf-8;
server_tokens off;
client_max_body_size 64k;

gzip on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;
gzip_min_length 1024;

error_page 404 /404.html;

# Legacy 301s (see redirects.map)
if ($bigcat_redirect) { return 301 $bigcat_redirect; }

# Canonical URL form: no trailing slash, no /index.html
rewrite ^/(.+)/$ /$1 permanent;
rewrite ^(.*)/index\.html$ $1 permanent;

# Hide dotfiles (except ACME) and build metadata
location ~ /\.(?!well-known/) { return 404; }

# Hashed, immutable assets: cache for a year
location ^~ /assets/ {
    include /etc/nginx/snippets/bigcat-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
    access_log off;
}

# Un-hashed static files: short cache
location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?)$ {
    include /etc/nginx/snippets/bigcat-security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}
location ~* ^/(sitemap\.xml|robots\.txt)$ {
    include /etc/nginx/snippets/bigcat-security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# PHP API — only the five public endpoints; everything else under /api is 404.
location ^~ /api/ {
    location ~ ^/api/(contact|checkup|subscribe|health|token)\.php$ {
        root $bigcat_root;                    # /api/x.php -> current/api/x.php
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $bigcat_root/dist;
        fastcgi_param BIGCAT_ENV_FILE $bigcat_private/bigcat.env;
        fastcgi_param HTTP_PROXY      "";      # httpoxy mitigation
        fastcgi_read_timeout 30s;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    return 404;
}

# Prerendered HTML pages: never long-cache (so deploys show immediately)
location = / {
    include /etc/nginx/snippets/bigcat-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}
location / {
    include /etc/nginx/snippets/bigcat-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html =404;
}
location = /404.html {
    include /etc/nginx/snippets/bigcat-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    internal;
}
