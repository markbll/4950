# ---------------------------------------------------------------------------
# Big Cat Marketing — Nginx site config (staging + production)
#
# Layout on the server (see docs/DEPLOYMENT.md):
#   /var/www/bigcat/<env>/releases/<timestamp>/{dist,api,shared}
#   /var/www/bigcat/<env>/current  -> symlink to the live release
#   /var/www/bigcat/<env>/private/bigcat.env   (secrets, 0640, NOT in web root)
#   /var/www/bigcat/<env>/private/storage/     (rate-limit data, 0700)
#
# Put this map in the http {} context (e.g. /etc/nginx/conf.d/bigcat-map.conf):
#   map $uri $bigcat_redirect { default ""; include /etc/nginx/snippets/bigcat-redirects.map; }
# and copy redirects.map + bigcat-security-headers.conf into /etc/nginx/snippets/.
#
# NOTE ON STAGING HOSTNAME: "ai_website" contains an underscore. Public CAs
# (including Let's Encrypt) will NOT issue certificates for hostnames with
# underscores, so HTTPS cannot work on ai_website.bigcatmarketing.com.au.
# Recommended: use ai-website.bigcatmarketing.com.au (hyphen) or
# staging.bigcatmarketing.com.au. The block below uses the hyphenated name.
# ---------------------------------------------------------------------------

# ---- HTTP → HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name bigcatmarketing.com.au www.bigcatmarketing.com.au ai-website.bigcatmarketing.com.au;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# ---- www → apex ----
server {
    listen 443 ssl http2;   # nginx >= 1.25.1: use "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name www.bigcatmarketing.com.au;
    ssl_certificate     /etc/letsencrypt/live/bigcatmarketing.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigcatmarketing.com.au/privkey.pem;
    return 301 https://bigcatmarketing.com.au$request_uri;
}

# ---- STAGING (private, noindex) ----
server {
    listen 443 ssl http2;   # nginx >= 1.25.1: use "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name ai-website.bigcatmarketing.com.au;
    ssl_certificate     /etc/letsencrypt/live/ai-website.bigcatmarketing.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-website.bigcatmarketing.com.au/privkey.pem;

    set $bigcat_root /var/www/bigcat/staging/current;
    set $bigcat_private /var/www/bigcat/staging/private;

    # Keep staging private: HTTP basic auth + noindex header on every response.
    auth_basic "Big Cat staging";
    auth_basic_user_file /etc/nginx/.htpasswd-bigcat-staging;
    set $bigcat_robots "noindex, nofollow";

    include /etc/nginx/snippets/bigcat-site.conf;
}

# ---- PRODUCTION (do not enable until UAT sign-off + explicit approval) ----
server {
    listen 443 ssl http2;   # nginx >= 1.25.1: use "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name bigcatmarketing.com.au;
    ssl_certificate     /etc/letsencrypt/live/bigcatmarketing.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigcatmarketing.com.au/privkey.pem;

    set $bigcat_root /var/www/bigcat/production/current;
    set $bigcat_private /var/www/bigcat/production/private;
    set $bigcat_robots "";   # empty = header not sent

    include /etc/nginx/snippets/bigcat-site.conf;
}
